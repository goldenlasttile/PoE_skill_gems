<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="description" content="Path of Exile 1 젬 밸런스 변경을 수치로 비교하는 모바일 시각화 페이지">
  <title>PoE1 | 젬 밸런스 변화</title>
  <link rel="stylesheet" href="./style.css?v=2">
  <script src="./app.js?v=2" defer></script>
</head>
<body>
  <div class="shell">
    <header class="site-head">
      <a href="../index.html" class="site-brand" title="기존 스킬젬 뷰어로 이동">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span class="brand-text">PoE1 <b>Gem Balance</b></span>
      </a>
      <a class="viewer-link" href="../index.html"><span>기존 뷰어</span><span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <section class="patch-toolbar" aria-label="패치 선택">
        <div class="patch-context">
          <div class="patch-context-title">젬 밸런스 변경 <span id="patch-overline">3.28 → 3.29</span></div>
          <div class="hero-meta"><span id="basis-label">Lv20 · 품질 20%</span><span class="meta-dot">·</span><span id="source-label">패치노트 기준</span></div>
        </div>
        <label class="patch-switch"><span>패치 버전</span><select id="patch-select" aria-label="패치 버전 선택"><option value="3.29">3.29</option><option value="3.30">3.30</option></select></label>
      </section>

      <section class="overview" aria-label="변경 요약">
        <div class="overview-head"><span class="section-kicker">OVERVIEW</span><span class="overview-sub" id="overall-note">불러오는 중...</span></div>
        <div class="summary-grid" id="summary-grid">
          <div class="summary-item"><span class="summary-label">변경 젬</span><strong>—</strong></div>
          <div class="summary-item"><span class="summary-label">상향</span><strong>—</strong></div>
          <div class="summary-item"><span class="summary-label">하향</span><strong>—</strong></div>
          <div class="summary-item"><span class="summary-label">조정</span><strong>—</strong></div>
        </div>
        <div class="distribution-track" id="distribution" aria-label="변경 유형별 비중"></div>
        <p class="notice" id="source-notice" hidden></p>
      </section>

      <section class="results-section" aria-labelledby="result-title">
        <div class="section-title-row"><div><span class="section-kicker">EXPLORE CHANGES</span><h2 id="result-title">변경된 젬 찾기</h2></div><span class="results-count" id="results-count">—</span></div>

        <div class="filter-panel">
          <label class="search-field"><span aria-hidden="true" class="search-icon">⌕</span><span class="sr-only">젬 이름 검색</span><input id="search" type="search" placeholder="젬 이름 검색 (한글 / 영어)" autocomplete="off" spellcheck="false"><span class="key-hint" aria-hidden="true">/</span></label>
          <div class="filter-row" id="verdict-filters" role="group" aria-label="변경 판정 필터">
            <button type="button" class="pill is-selected" data-verdict="all">전체</button>
            <button type="button" class="pill" data-verdict="buff">↗ 상향</button>
            <button type="button" class="pill" data-verdict="nerf">↘ 하향</button>
            <button type="button" class="pill" data-verdict="mixed">↔ 복합</button>
            <button type="button" class="pill" data-verdict="adjusted">• 조정</button>
            <button type="button" class="pill" data-verdict="new">✦ 신규</button>
          </div>
          <div class="control-row">
            <label class="field-box small-box"><span>젬 종류</span><select id="kind-select"><option value="all">전체 종류</option><option value="active">스킬젬</option><option value="support">보조젬</option><option value="transfigured">변형 젬</option><option value="vaal">바알 젬</option></select></label>
            <label class="field-box metric-box"><span>변경폭 기준</span><select id="metric-select"><option value="all">주요 변경폭</option><option value="damage">기본 피해량</option><option value="effectiveness">추가 피해 효율</option><option value="supportDamage">보조 피해 배율</option><option value="speed">시전·공격 속도</option><option value="cooldown">재사용 대기시간</option><option value="cost">소모 비용·배율</option><option value="crit">치명타 확률</option><option value="radius">효과 반경</option><option value="duration">지속시간</option><option value="projectiles">투사체 수</option><option value="count">변경 항목 수</option></select></label>
            <button id="sort-dir" class="sort-btn" type="button" aria-label="정렬 방향 변경"><span class="sort-icon">↓</span><span id="sort-dir-text">상향순</span></button>
          </div>
        </div>

        <div class="list-toolbar"><div class="toolbar-caption" id="list-description">선택한 정렬 기준으로 주요 변경 수치가 강조됩니다.</div><button class="reset-btn" id="reset-filters" type="button">초기화 ↺</button></div>
        <div class="gem-list" id="gem-list" aria-live="polite"><div class="loading">변경 데이터를 읽고 있습니다...</div></div>
        <div class="list-footnote" id="list-footnote"></div>
      </section>
    </main>

    <footer class="footer"><span>PoE1 Gem Balance</span><span>원문 기준 비교 · 수치는 출처에 따라 검증 필요</span></footer>
  </div>

  <div id="modal" class="modal-root" aria-hidden="true">
    <div class="modal-backdrop" data-close="true"></div>
    <section class="modal-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
      <div class="modal-handle" aria-hidden="true"></div>
      <div class="modal-top"><div class="modal-id" id="modal-id"></div><button class="modal-close" type="button" id="modal-close" aria-label="상세 닫기">×</button></div>
      <div class="modal-scroll" id="modal-body"></div>
      <div class="modal-bottom"><span id="modal-basis">Lv20 · Q20</span><a id="modal-source" target="_blank" rel="noopener noreferrer" href="https://www.pathofexile.com/forum/view-thread/3987254">공식 원문 ↗</a></div>
    </section>
  </div>
</body>
</html>
