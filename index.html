<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoE1 Skill Gem Viewer</title>
<style>
:root{color-scheme:dark;--bg:#0d1015;--p:#151a22;--p2:#1a202a;--line:#2d3745;--tx:#e7e2d6;--mut:#9aa6b5;--gold:#d7b86f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.app{max-width:1600px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}
h1{font-size:20px;margin:0;color:#f0e2bf}.small{font-size:12px;color:var(--mut)}button,input,select{font:inherit}
.status{font-size:12px;color:var(--mut);margin-top:4px}.err{color:#ff9696}
.stats{display:flex;align-items:center;gap:9px;margin:4px 0 7px;white-space:nowrap;overflow-x:auto;scrollbar-width:none;font-size:11px;color:var(--mut)}
.stats::-webkit-scrollbar{display:none}
.st{display:inline-flex;align-items:baseline;gap:3px;flex:0 0 auto;padding:0;background:none;border:0;border-radius:0}
.st b{display:inline;font-size:11px;font-weight:700;color:#d9cda9}
.st span{font-size:11px;color:var(--mut)}

.tag-filter-wrap{margin:6px 0 10px;padding:9px;background:#10151c;border:1px solid var(--line);border-radius:9px}
.tag-filter-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.tag-filter-help{font-size:10px;color:var(--mut)}
.tag-filter-list{display:flex;flex-wrap:wrap;gap:5px}
.tag-filter-btn{appearance:none;border:1px solid #42617e;background:#294d70;color:#e5edf6;border-radius:6px;padding:5px 9px;font-size:12px;line-height:1.15;cursor:pointer;transition:.12s ease;white-space:nowrap}
.tag-filter-btn:hover{filter:brightness(1.12)}
.tag-filter-btn.is-on{border-color:#74c98b;background:#244f39;box-shadow:inset 0 0 0 1px #74c98b55}
.tag-filter-btn.is-off{border-color:#d86b6b;background:#4b292d;color:#ffb1b1;text-decoration:line-through}
.tag-reset{border-color:#46505d;background:#171d25;color:#9ba6b4}
.tag-filter-btn.tag-fire{color:#ff875f}.tag-filter-btn.tag-cold{color:#73c9ef}.tag-filter-btn.tag-lightning{color:#ffd15c}
.tag-filter-btn.tag-physical{color:#e9a095}.tag-filter-btn.tag-chaos{color:#cf8ee8}.tag-filter-btn.tag-attack{color:#ff9854}
.tag-filter-btn.tag-spell{color:#a8c6ff}.tag-filter-btn.tag-minion{color:#77d0b1}.tag-filter-btn.tag-critical{color:#dca4f2}
.tag-filter-btn.is-on,.tag-filter-btn.is-off{color:inherit}
.tag-filter-btn.is-off{color:#ffaaaa}
.tag-filter-btn small{font-size:9px;opacity:.62;margin-left:2px}
.nav-float{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));z-index:1000;display:flex;gap:6px;padding:6px;background:#0b0f15dc;border:1px solid #3a4657;border-radius:12px;box-shadow:0 5px 22px #0008;backdrop-filter:blur(8px)}
.nav-float button{width:44px;height:44px;border:1px solid #415064;border-radius:9px;background:#1d2632;color:#e7edf5;font-size:20px;font-weight:700;display:grid;place-items:center;padding:0}
.nav-float button:active{transform:translateY(1px);background:#2a3747}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:7px;margin-bottom:9px}
input,select{background:#11161d;border:1px solid #354153;color:var(--tx);border-radius:7px;padding:9px}
.main{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{border:1px solid var(--line);background:var(--p);border-radius:9px;overflow:hidden}
.ph{padding:11px 12px;border-bottom:1px solid var(--line);font-weight:700}.tw{max-height:calc(100vh - 230px);overflow:auto;min-height:520px}
table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;background:#1b222c;color:#abb7c5;text-align:left;padding:8px}
td{padding:8px;border-bottom:1px solid #242d39}tbody tr{cursor:pointer}
.compare-th{min-width:126px}
.compare-head{display:flex;align-items:center;gap:3px}
.compare-head select{min-width:0;width:102px;padding:4px 3px;font-size:10px;background:#151c24}
.compare-sort{width:22px;height:25px;padding:0;border:1px solid #3b4655;border-radius:5px;background:#171e27;color:#aeb9c6;cursor:pointer;font-size:11px}
.compare-sort.active{border-color:#d2b765;color:#f0d997}
.compare-value{display:inline-block;font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums;color:#d8e0e9}
.compare-empty{color:#5f6b78}
.aux-th{min-width:136px}
.aux-th select{min-width:0;width:110px;padding:4px 3px;font-size:10px;background:#151c24}
.aux-value{display:inline-block;font-size:10px;line-height:1.3;font-variant-numeric:tabular-nums;color:#d8e0e9;white-space:normal}

tbody tr:hover{background:#202834}tbody tr.sel{background:#2a2618}
.badge{display:inline-block;padding:2px 6px;border:1px solid #3b4655;border-radius:999px;font-size:10px}.orb{display:inline-block;width:9px;height:9px;border-radius:50%}
.r{background:#dd6262}.g{background:#62c17e}.b{background:#65a7e8}.w{background:#ddd}.detail{padding:13px;max-height:calc(100vh - 230px);overflow:auto}
.detail h2{margin:0 0 4px;color:#f0e2bf}.id{font:11px ui-monospace,monospace;color:#8795a7;word-break:break-all}
.fixed-effects{margin:7px 0 10px;padding:10px 11px;background:#111720;border:1px solid #334050;border-radius:8px}
.fixed-effects-title{font-size:11px;color:#d7bd7e;font-weight:700;margin-bottom:7px}
.fixed-group+.fixed-group{margin-top:8px;padding-top:8px;border-top:1px solid #28323e}
.fixed-group-label,.stat-group-label{font-size:10px;color:#8290a1;font-weight:700;margin-bottom:4px}
.fixed-line,.stat-line{font-size:12px;line-height:1.55;color:#dbe2e9;white-space:pre-line}
.fixed-line+.fixed-line,.stat-line+.stat-line{margin-top:3px}
.fixed-basic .fixed-line{color:#edddb7}
.stat-cell{min-width:330px}
.stat-group+.stat-group{margin-top:7px;padding-top:6px;border-top:1px dashed #303b49}
.stat-basic .stat-line{color:#e7d7ad}
.desc{margin:11px 0;line-height:1.6;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.box{padding:8px;background:#10151c;border:1px solid #2c3644;border-radius:7px}.box .k{font-size:10px;color:#8793a2}.box .v{font-size:12px;margin-top:2px;word-break:break-word}
.quality-box{grid-column:1/-1}
.tooltip-box{grid-column:1/-1}
.tooltip-text{font-size:13px;line-height:1.65;color:#e0e5eb;margin-top:5px;white-space:pre-line}
.tooltip-sub{margin-top:8px;padding-top:7px;border-top:1px solid #2b3643}
.tooltip-sub-label{font-size:10px;color:#8793a2;margin-bottom:4px}
.tooltip-chip-list{display:flex;flex-wrap:wrap;gap:5px}
.tooltip-chip{display:inline-block;padding:3px 6px;border:1px solid #3b4859;border-radius:5px;background:#1a222c;color:#cbd4df;font-size:11px}

.quality-lines{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.quality-line{font-size:12px;line-height:1.55;color:#e7dcbf}
.triggered-skill{margin:10px 0;padding:11px;background:#17131d;border:1px solid #57436b;border-radius:9px}
.triggered-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.triggered-title{font-size:13px;font-weight:800;color:#d8b7f2}
.triggered-label{font-size:10px;color:#a891bb;border:1px solid #554269;border-radius:999px;padding:2px 6px;white-space:nowrap}
.triggered-desc{font-size:12px;line-height:1.6;color:#cfd5dc;margin:6px 0 8px}
.triggered-meta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.triggered-meta .tag{background:#211a29;border-color:#4d3a5d}
.triggered-fixed{margin-top:7px;padding-top:7px;border-top:1px solid #392d44}
.triggered-fixed-title{font-size:10px;color:#a891bb;font-weight:700;margin-bottom:4px}
.triggered-level{margin-top:8px;padding-top:7px;border-top:1px dashed #4a3959}
.triggered-level-title{font-size:10px;color:#c09cdd;font-weight:800;margin-bottom:4px}
.triggered-quality{margin-top:7px;padding-top:7px;border-top:1px solid #392d44}
.triggered-missing{margin:9px 0;padding:9px 10px;border:1px solid #684849;background:#24191b;border-radius:8px;color:#e7b2b2;font-size:11px;line-height:1.5}


.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}
.tag{padding:3px 6px;border-radius:5px;background:#1c2530;border:1px solid #344252;font-size:11px}
.gem-tags-wrap{margin:9px 0}
.gem-tags-label{font-size:10px;color:#8793a2;margin-bottom:5px}
.gem-public-tags{display:flex;flex-wrap:wrap;gap:5px}
.gem-public-tag{padding:4px 7px;border-radius:6px;background:#1c2530;border:1px solid #3a495a;font-size:11px;color:#d5dde7}
.gem-public-tag.tag-fire{color:#ff9b78;border-color:#714839}
.gem-public-tag.tag-cold{color:#83d4f4;border-color:#386174}
.gem-public-tag.tag-lightning{color:#ffda72;border-color:#6e6038}
.gem-public-tag.tag-physical{color:#ebb1a8;border-color:#6a4945}
.gem-public-tag.tag-chaos{color:#d49be9;border-color:#624670}
.gem-public-tag.tag-support{color:#d4dae1}
.gem-internal-tags{margin-top:7px}
.gem-internal-tags summary{cursor:pointer;color:#738091;font-size:10px;user-select:none}
.gem-internal-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gem-internal-tag{padding:3px 6px;border-radius:5px;border:1px dashed #3a4552;color:#7e8996;background:#151b22;font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
.weapon-tags-wrap{margin-top:5px}
.weapon-filter-wrap{padding:0;overflow:hidden}
.weapon-filter-toggle{appearance:none;width:100%;border:0;background:transparent;color:inherit;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}
.weapon-filter-toggle:hover{background:#151c25}
.weapon-filter-toggle:focus-visible{outline:1px solid #64758a;outline-offset:-2px}
.weapon-filter-meta{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:10px}
.weapon-filter-arrow{display:inline-block;transition:transform .2s ease}
.weapon-filter-toggle[aria-expanded="true"] .weapon-filter-arrow{transform:rotate(90deg)}
.weapon-filter-body{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .22s ease,opacity .18s ease}
.weapon-filter-body.open{grid-template-rows:1fr;opacity:1}
.weapon-filter-inner{overflow:hidden}
.weapon-filter-content{padding:0 9px 9px}
.weapon-filter-help{margin-bottom:7px;text-align:right}


pre{white-space:pre-wrap;word-break:break-word;font:11px/1.45 ui-monospace,monospace}.sect{margin-top:12px}.sect h3{font-size:12px;color:var(--gold);margin:0 0 6px}
.level-priority-table td:nth-child(2) pre{margin:0;line-height:1.55}
.level-toggle-target{cursor:pointer;display:inline-block;min-width:18px;text-align:center;text-decoration:underline dotted #68788c;text-underline-offset:3px}
.level-toggle-target:hover{color:#f0dca9;text-decoration-color:#d0b66e}
.level-toggle-target::after{content:' ▾';font-size:9px;color:#778596;text-decoration:none}
.level-toggle-target.is-collapsed::after{content:' ▸'}
.level-row-collapsed{display:none}

.level-priority-table td:nth-child(3) pre{margin:0}
.pager{padding:8px 10px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.pager button{background:#202733;color:var(--tx);border:1px solid #394555;border-radius:6px;padding:5px 9px}

.mobile-back{display:none}
@media(max-width:900px){
  body{overflow-x:hidden}
  .app{padding:10px}
  .top{align-items:flex-start}
  .top h1{font-size:18px}
  .stats{gap:7px;margin:3px 0 6px;font-size:10px}
  .st b,.st span{font-size:10px}
  .tag-filter-wrap{padding:7px;margin:6px 0 8px}
  .tag-filter-list{gap:4px}
  .tag-filter-btn{padding:6px 8px;font-size:11px}
  .tag-filter-help{font-size:9px}
  .filters{grid-template-columns:1fr 1fr;gap:6px}
  .filters input{grid-column:1/-1}
  .main{display:block}
  #listPanel{display:block}
  #detailPanel{display:none}
  .tw{max-height:none;min-height:0}
  .tw table{table-layout:fixed}
  .tw th,.tw td{padding:9px 6px}
  .tw th:nth-child(1),.tw td:nth-child(1){width:30px;text-align:center}
  .tw th:nth-child(2),.tw td:nth-child(2){width:auto}
  .tw th:nth-child(3),.tw td:nth-child(3){width:88px}
  .tw th:nth-child(4),.tw td:nth-child(4){width:88px}
  .compare-head{gap:2px}
  .compare-head select{width:70px;padding:4px 2px;font-size:9px}
  .compare-sort{width:20px;height:24px}
  .compare-value{font-size:10px}
  .tw table{width:100%;min-width:0;table-layout:fixed}
  .tw th:nth-child(1),.tw td:nth-child(1){width:24px}
  .tw th:nth-child(2),.tw td:nth-child(2){width:auto}
  .tw th:nth-child(3),.tw td:nth-child(3){width:88px}
  .tw th:nth-child(4),.tw td:nth-child(4){width:88px}
  .tw th:nth-child(5),.tw td:nth-child(5){display:table-cell;width:88px}
  .aux-th select{width:78px}
  .aux-value{font-size:10px;white-space:normal;line-height:1.25}
  .tw td:nth-child(2){font-size:13px;font-weight:600;word-break:keep-all}
  .pager{position:sticky;bottom:0;background:var(--p);z-index:5}
  .detail{max-height:none;min-height:calc(100vh - 70px);padding:12px}
  .detail h2{font-size:21px;padding-right:4px}
  .kv{grid-template-columns:1fr 1fr}
  .sect table{min-width:760px}
  .level-priority-table th:nth-child(1),.level-priority-table td:nth-child(1){position:sticky;left:0;z-index:2;background:var(--p);width:48px;min-width:48px}
  .level-priority-table th:nth-child(2),.level-priority-table td:nth-child(2){min-width:390px}
  .level-priority-table th:nth-child(3),.level-priority-table td:nth-child(3){min-width:105px}
  .level-priority-table th:nth-child(4),.level-priority-table td:nth-child(4){min-width:75px}
  .level-priority-table th:nth-child(5),.level-priority-table td:nth-child(5){min-width:155px}
  .mobile-back{
    display:inline-flex;align-items:center;gap:5px;
    position:sticky;top:0;z-index:20;
    width:100%;margin:-12px -12px 12px;padding:11px 12px;
    border:0;border-bottom:1px solid var(--line);
    background:#1b222c;color:#f0e2bf;font-weight:700;text-align:left
  }
  body.mobile-detail .top,
  body.mobile-detail .stats,
  body.mobile-detail .filters,
  body.mobile-detail .tag-filter-wrap,
  body.mobile-detail #listPanel{display:none}
  body.mobile-detail #detailPanel{display:block;border-radius:0;border-left:0;border-right:0}
  body.mobile-detail .app{padding:0}
  body.mobile-detail .main{display:block}
}
@media(max-width:520px){
  .stats{gap:6px}
  .filters{grid-template-columns:1fr 1fr}
  input,select{font-size:14px;padding:10px 8px;min-width:0}
  .badge{font-size:9px;padding:2px 4px}
  .kv{grid-template-columns:1fr}
  .detail{font-size:14px}
}


/* Top-right legacy balance link and the version selector inside .filters */
.top h1{min-width:0}
.balance-switch{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex:0 0 auto;padding:8px 11px;border:1px solid #497b70;border-radius:8px;background:#1a302d;color:#b7ead8;text-decoration:none;font-size:12px;font-weight:700;line-height:1.15;white-space:nowrap;transition:border-color .15s ease,background .15s ease,color .15s ease}
.balance-switch:hover{background:#24423a;border-color:#75bf9d;color:#eefdf6}
.balance-switch:focus-visible{outline:2px solid #93dfc1;outline-offset:3px}
.balance-switch-label-short{display:none}
.version-select{width:100%;min-width:0;max-width:none;padding:9px;background:#18222c;border:1px solid #48586b;border-radius:7px;color:#e7e2d6;font-weight:650;font-size:12px;cursor:pointer}
@media(max-width:520px){.top{gap:8px;align-items:center}.balance-switch{padding:8px 9px;font-size:11px}.balance-switch-label-long{display:none}.balance-switch-label-short{display:inline}.version-select{padding:10px 8px;font-size:14px}}
[hidden]{display:none!important}
.balance-filter{display:flex;align-items:center;gap:7px;margin:0 0 9px;flex-wrap:wrap}
.balance-filter-btn{padding:6px 12px;background:#141c25;border:1px solid #465264;border-radius:6px;color:#93a3b5;font-size:12px;cursor:pointer}
.balance-filter-btn.is-active{background:#283849;border-color:#7e98b1;color:#ecf1f6;font-weight:700}
.balance-source-note{margin-left:auto;font-size:10px;color:#92a4b5}
body.balance-change .main{grid-template-columns:minmax(0,1fr)}
body.balance-change #detailPanel{display:none!important}
body.balance-change #listPanel{min-width:0}
body.balance-change .tw{max-height:calc(100vh - 250px)}
body.balance-change .tw table{table-layout:fixed}
body.balance-change .tw th:nth-child(1),body.balance-change .tw td:nth-child(1){width:34px;text-align:center}
body.balance-change .tw th:nth-child(2),body.balance-change .tw td:nth-child(2){width:auto}
body.balance-change .tw th:nth-child(3),body.balance-change .tw td:nth-child(3),body.balance-change .tw th:nth-child(4),body.balance-change .tw td:nth-child(4),body.balance-change .tw th:nth-child(5),body.balance-change .tw td:nth-child(5){width:152px}
body.balance-change .compare-head select{width:112px}
body.balance-change .aux-th select{width:112px}
.balance-change-num{font-size:inherit;font-weight:700;white-space:nowrap}
.balance-change-num.is-buff{color:#44FF44}
.balance-change-num.is-nerf{color:#FF4444}
.balance-change-num.is-neutral{color:#d8e0e9}
.balance-old-num{font-size:inherit;color:#b7c2cc;white-space:nowrap}
.balance-cell-vals{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.balance-gem-added{font-size:10px;margin-left:5px;color:#9ecce9;white-space:nowrap;font-weight:700}
body.balance-pending .tag-filter-wrap,body.balance-pending .balance-filter,body.balance-pending .pager,body.balance-pending #listPanel thead{display:none!important}
body.balance-pending .filters{display:grid!important;grid-template-columns:minmax(0,200px)}
body.balance-pending .filters>:not(.version-select){display:none!important}
body.balance-pending .tw{max-height:none;min-height:120px}
.balance-wait{padding:30px 12px!important;color:#b5c2cf;text-align:center!important;font-size:14px}
/* Centered two-column change modal */
.balance-modal{position:fixed;inset:0;z-index:2000;display:none}
.balance-modal.is-open{display:block}
.balance-modal-backdrop{position:absolute;inset:0;background:#03070bd0}
.balance-modal-sheet{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(720px,calc(100vw - 24px));max-height:min(86dvh,790px);display:flex;flex-direction:column;background:#151d26;border:1px solid #465363;border-radius:12px;box-shadow:0 20px 70px #000b;overflow:hidden}
.balance-modal-top{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #303d4b;color:#9faebf;font-size:12px}
.balance-modal-top button{width:32px;height:32px;display:grid;place-items:center;border:1px solid #4a5664;border-radius:7px;background:#222d39;color:#e6ecf3;font-size:23px;line-height:1;cursor:pointer}
.balance-modal-body{overflow-y:auto;overscroll-behavior:contain;padding:16px;min-height:0}
.balance-modal-name{font-size:21px;font-weight:750;color:#f0e2bf;margin:0}
.balance-modal-en{font-size:11px;color:#96a8b8;margin:3px 0 12px}
.balance-modal-verdict{font-size:11px;color:#bbc9d5;margin-bottom:12px}
.balance-modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-items:stretch}
.balance-tile{min-width:0;padding:11px 12px;background:#101821;border:1px solid #334151;border-radius:8px}
.balance-tile.buff{border-top:2px solid #44FF44}.balance-tile.nerf{border-top:2px solid #FF4444}
.balance-tile .balance-tile-label{font-size:11px;font-weight:700;color:#d3dce5;margin-bottom:8px}
.balance-tile .balance-tile-values{display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums;font-size:12px}
.balance-tile .balance-old{color:#a0afbf}
.balance-tile .balance-new{font-weight:750;color:#e6eef5}
.balance-tile .balance-new.buff,.balance-tile .balance-delta.buff{color:#44FF44}
.balance-tile .balance-new.nerf,.balance-tile .balance-delta.nerf{color:#FF4444}

function formatSeconds(ms){
  if(ms===null||ms===undefined||ms==='')return '-';
  const n=Number(ms);
  if(!Number.isFinite(n))return String(ms);
  if(n===0)return '즉시';
  const sec=n/1000;
  return `${Number(sec.toFixed(3))}초`;
}
function skillSpeedInfo(d,a,s){
  const types=Array.isArray(a.types)?a.types:[];
  if(types.includes('Attack')){
    const raw=s.attack_speed_multiplier;
    const pct=100+(raw==null?0:Number(raw));
    return {label:'공격 속도', value:`기본 공격 속도의 ${Number.isFinite(pct)?pct:100}%`};
  }
  if(types.includes('Spell')){
    return {label:'시전 시간', value:formatSeconds(d.cast_time)};
  }
  if(d.cast_time!==null&&d.cast_time!==undefined){
    return {label:'사용 시간', value:formatSeconds(d.cast_time)};
  }
  return {label:'속도', value:'-'};
}
function formatCrit(raw){
  if(raw===null||raw===undefined||raw==='')return '-';
  const n=Number(raw);
  return Number.isFinite(n)?`${Number((n/100).toFixed(2))}%`:String(raw);
}
function formatRequirements(req){
  req=req||{};
  const parts=[];
  if(req.str!=null && Number(req.str)!==0)parts.push(`힘 ${req.str}`);
  if(req.dex!=null && Number(req.dex)!==0)parts.push(`민첩 ${req.dex}`);
  if(req.int!=null && Number(req.int)!==0)parts.push(`지능 ${req.int}`);
  return parts.length?parts.join(' / '):'-';
}

const DISPLAY_QUALITY=20;

function cleanNumber(v,maxDecimals=2){
  const n=Number(v);
  if(!Number.isFinite(n))return String(v??'-');
  const p=10**maxDecimals;
  const x=Math.round((n+Number.EPSILON)*p)/p;
  return String(Object.is(x,-0)?0:x);
}
function qualityTransform(v,op){
  let n=Number(v);
  if(!Number.isFinite(n))return v;
  switch(op){
    case 'locations_to_metres':
      n=n/10; break;
    case 'milliseconds_to_seconds':
    case 'milliseconds_to_seconds_2dp':
    case 'milliseconds_to_seconds_2dp_if_required':
      n=n/1000; break;
    case 'negate':
      n=-n; break;
    case 'divide_by_ten_1dp_if_required':
      n=n/10; break;
    case 'per_minute_to_per_second':
      n=n/60; break;
    case 'divide_by_one_hundred':
    case 'divide_by_one_hundred_2dp':
      n=n/100; break;
  }
  const decimals=(
    op==='milliseconds_to_seconds_2dp' ||
    op==='milliseconds_to_seconds_2dp_if_required' ||
    op==='divide_by_one_hundred_2dp'
  )?2:(op==='divide_by_ten_1dp_if_required'?1:2);
  return cleanNumber(n,decimals);
}
function renderQualityTemplate(template,stats,quality=DISPLAY_QUALITY){
  if(!template)return '';
  return String(template).replace(/\{([^{}]+)\}/g,(_,expr)=>{
    const parts=expr.split('/');
    const statId=parts.shift();
    const raw=stats?.[statId];
    if(raw===null||raw===undefined)return `{${expr}}`;
    let value=Number(raw)*quality/1000;
    for(const op of parts)value=qualityTransform(value,op);
    return cleanNumber(value,2);
  });
}
function quality20Lines(staticData){
  const qs=Array.isArray(staticData?.quality_stats)?staticData.quality_stats:[];
  const out=[];
  for(const q of qs){
    if(!q||typeof q!=='object'||!q.stat)continue;
    const text=renderQualityTemplate(q.stat,q.stats||{},DISPLAY_QUALITY)
      .replace(/\r\n?/g,'\n').trim();
    if(!text)continue;
    for(const line of text.split('\n')){
      const t=line.trim();
      if(t&&!out.includes(t))out.push(t);
    }
  }
  return out;
}

const WEAPON_LABELS={
  'One Hand Sword':'한손검',
  'Thrusting One Hand Sword':'찌르기 한손검',

}


function weaponRestrictionsHtml(a,rawTags=[]){

    ? [...a.weapon_restrictions.filter(Boolean)]

  // "bow" was previously a public skill tag. Treat it as a weapon instead.

}
function gemTooltipHtml(d,a){
  const sg=d?.support_gem||{};

}

  </div>`;
}

function mergeRepoe(base,over){
  if(over===null||over===undefined){
    if(Array.isArray(base))return base.map(v=>mergeRepoe(v,null));
    if(base&&typeof base==='object'){
      const out={};for(const [k,v] of Object.entries(base))out[k]=mergeRepoe(v,null);return out;
    }
    return base;
  }
  if(base===null||base===undefined){
    if(Array.isArray(over))return over.map(v=>mergeRepoe(null,v));
    if(over&&typeof over==='object'){
      const out={};for(const [k,v] of Object.entries(over))out[k]=mergeRepoe(null,v);return out;
    }
    return over;
  }
  if(Array.isArray(base)&&Array.isArray(over)){
    const n=Math.max(base.length,over.length),out=[];
    for(let i=0;i<n;i++)out.push(mergeRepoe(base[i],over[i]));
    return out;
  }
  if(base&&over&&typeof base==='object'&&typeof over==='object'&&!Array.isArray(base)&&!Array.isArray(over)){
    const out={};
    for(const k of new Set([...Object.keys(base),...Object.keys(over)]))out[k]=mergeRepoe(base[k],over[k]);
    return out;
  }
  return over;
}
function levelKeys(pl){
  return Object.keys(pl||{}).sort((a,b)=>{
    const an=Number(a),bn=Number(b);
    if(Number.isFinite(an)&&Number.isFinite(bn))return an-bn;
    return String(a).localeCompare(String(b));
  });
}
function normStatKey(k){
  return String(k??'').replace(/\r\n?/g,'\n').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
}
function tooltipRankMap(order){
  const m=new Map();
  (Array.isArray(order)?order:[]).forEach((k,i)=>m.set(normStatKey(k),i));
  return m;
}
function sortedStatKeys(keys,rank){
  return [...keys].sort((a,b)=>{
    const ar=rank.has(normStatKey(a))?rank.get(normStatKey(a)):999999;
    const br=rank.has(normStatKey(b))?rank.get(normStatKey(b)):999999;
    return ar-br || String(a).localeCompare(String(b),'ko');
  });
}
function uniqueTexts(lines){
  const seen=new Set(),out=[];
  for(const x of lines||[]){
    const t=String(x??'').trim();
    if(!t||seen.has(t))continue;
    seen.add(t);out.push(t);
  }
  return out;
}
function formatPct(n,maxDecimals=1){
  const v=Number(n);
  if(!Number.isFinite(v))return '-';
  const fixed=Number(v.toFixed(maxDecimals));
  return `${fixed}%`;
}
function attackDamageText(raw){
  const n=raw==null?0:Number(raw);
  return `공격 피해: 기본 피해의 ${formatPct(100+(Number.isFinite(n)?n:0)/100)}`;
}
function damageEffectivenessText(raw){
  const n=raw==null?0:Number(raw);
  return `추가 피해 효율: ${formatPct(100+(Number.isFinite(n)?n:0),1)}`;
}

async function loadSecondaryEffects(){
  if(secondaryEffectsCache!==null)return secondaryEffectsCache;
  try{
    const r=await fetch(SECONDARY_EFFECTS_PATH,{cache:'no-store'});
    if(!r.ok){
      secondaryEffectsCache={};
      return secondaryEffectsCache;
    }
    const data=await r.json();
    secondaryEffectsCache=(data&&data.effects&&typeof data.effects==='object')?data.effects:
      (data&&typeof data==='object'?data:{});
    return secondaryEffectsCache;
  }catch{
    secondaryEffectsCache={};
    return secondaryEffectsCache;
  }
}
async function localEffectData(effectId){
  if(!effectId)return null;
  const meta=all.find(x=>x.effectId===effectId);
  if(!meta)return null;
  try{
    const doc=await getChunk(meta.chunk);
    const gem=[...doc.querySelectorAll('gem')].find(x=>x.getAttribute('effectId')===effectId);
    if(!gem)return null;
    return obj(gem.querySelector(':scope > repoeGemData'));
  }catch{
    return null;
  }
}
async function resolveSecondaryEffect(d){
  const id=d?.secondary_granted_effect;
  if(!id)return null;

  // 바알 젬처럼 참조 대상이 실제 젬으로도 존재하면 기존 로컬 분할 XML을 우선 사용.
  const local=await localEffectData(id);
  if(local)return {id,data:local,source:'local'};

  // 장작/균열 보조처럼 아이템이 아닌 GrantedEffect는 전용 추출 파일에서 읽음.
  const effects=await loadSecondaryEffects();
  const data=effects?.[id];
  return data?{id,data,source:'secondary'}:null;
}
function secondaryEffectName(effect,id){
  return effect?.display_name || effect?.active_skill?.display_name || id || '발동 스킬';
}
function secondaryFixedLines(model){
  return uniqueTexts([
    ...(model?.fixedGenerated||[]),
    ...(model?.fixedStatTexts||[])
  ]);
}
function generatedAndTextLines(model,lv){
  if(!model||!lv)return [];
  const basics=uniqueTexts((model.variableGenerated||[]).map(def=>def.text(lv)));
  const effects=uniqueTexts((model.variableKeys||[]).map(k=>model.resolvedTextByLevel?.[lv]?.[k]));
  return uniqueTexts([...basics,...effects]);
}
function secondaryLevelForPrimary(primaryModel,secondaryModel,primaryLv){
  if(!secondaryModel?.levels?.length)return null;

  const secondaryLevels=secondaryModel.levels;
  const primaryReq=Number(primaryModel?.merged?.[primaryLv]?.required_level);

  // 1) Required-level match is the most reliable relation for hybrid support gems.
  if(Number.isFinite(primaryReq)){
    const exact=secondaryLevels.find(sl=>
      Number(secondaryModel?.merged?.[sl]?.required_level)===primaryReq
    );
    if(exact)return exact;
  }

  // 2) Usually both GrantedEffects use the same level key.
  if(secondaryLevels.includes(String(primaryLv)))return String(primaryLv);

  // 3) Fall back to ordinal mapping.
  const pIndex=(primaryModel?.levels||[]).indexOf(String(primaryLv));
  if(pIndex>=0 && secondaryLevels[pIndex]!=null)return secondaryLevels[pIndex];

  // 4) Last resort: nearest required level.
  if(Number.isFinite(primaryReq)){
    let best=null,bestDiff=Infinity;
    for(const sl of secondaryLevels){
      const req=Number(secondaryModel?.merged?.[sl]?.required_level);
      if(!Number.isFinite(req))continue;
      const diff=Math.abs(req-primaryReq);
      if(diff<bestDiff){best=sl;bestDiff=diff}
    }
    if(best!=null)return best;
  }
  return secondaryLevels[0]||null;
}

function levelCollapseInfo(model,maxLevelRaw){
  const maxLevel=Number(maxLevelRaw);
  if(!Number.isFinite(maxLevel))return {maxLevel:null,collapsible:false};
  const nums=(model?.levels||[]).map(x=>Number(x)).filter(Number.isFinite);
  return {maxLevel,collapsible:nums.some(n=>n>1&&n<maxLevel)};
}

  if(!secondaryModel)return '';
  const secondaryLv=secondaryLevelForPrimary(primaryModel,secondaryModel,String(primaryLv));
  if(!secondaryLv)return '';

  const lines=generatedAndTextLines(secondaryModel,secondaryLv);

  // Some secondary skills have only values that buildDisplayStatModel classified
  // as fixed. Those are already shown in the triggered-skill card, so don't
  // duplicate them in every row.

    <div class="triggered-level-title">${esc(secondaryName)} · Lv ${esc(primaryLv)}</div>

}

function buildDisplayStatModel(d){
  const a=d.active_skill||{},s=d.static||{},pl=d.per_level||{};
  const levels=levelKeys(pl);
  const rank=tooltipRankMap(d.tooltip_order);
  const staticText=(s.stat_text&&typeof s.stat_text==='object')?s.stat_text:{};

  // 모든 stat_text 키를 모은 뒤, 각 레벨에서 static + per_level fallback 결과를 비교한다.
  const keySet=new Set(Object.keys(staticText));
  for(const lv of levels){
    const lt=pl[lv]?.stat_text;
    if(lt&&typeof lt==='object')for(const k of Object.keys(lt))keySet.add(k);
  }

  const orderedKeys=sortedStatKeys(keySet,rank);
  const fixedKeys=[],variableKeys=[];
  const resolvedTextByLevel={};

  for(const lv of levels){
    const lt=(pl[lv]?.stat_text&&typeof pl[lv].stat_text==='object')?pl[lv].stat_text:{};
    const row={};
    for(const k of orderedKeys){
      const pv=Object.prototype.hasOwnProperty.call(lt,k)?lt[k]:null;
      const sv=Object.prototype.hasOwnProperty.call(staticText,k)?staticText[k]:null;
      row[k]=(pv!==null&&pv!==undefined&&String(pv).trim()!=='')?pv:sv;
    }
    resolvedTextByLevel[lv]=row;
  }

  for(const k of orderedKeys){
    const values=levels.map(lv=>resolvedTextByLevel[lv]?.[k])
      .map(v=>v==null?'':String(v).trim());
    const nonempty=values.filter(Boolean);
    const allPresent=levels.length>0 && nonempty.length===levels.length;
    const uniq=new Set(nonempty);
    if(allPresent && uniq.size===1)fixedKeys.push(k);
    else variableKeys.push(k);
  }

  // stat_text 밖의 핵심 수치. 각 레벨에서 merge한 값을 만들어 고정/가변 판별.
  const isAttack=Array.isArray(a.types)&&a.types.includes('Attack');
  const merged={};
  for(const lv of levels)merged[lv]=mergeRepoe(s,pl[lv]||{});

  // Triggered/secondary GrantedEffects do not always carry enough type metadata
  // for a reliable "Attack" check. If the actual data contains damage_multiplier,
  // it is an attack-damage progression and must be rendered.
  const hasDamageMultiplier =
    s.damage_multiplier!=null ||
    levels.some(lv=>pl[lv]?.damage_multiplier!=null);

  const hasDamageEffectiveness =
    isAttack ||
    hasDamageMultiplier ||
    s.damage_effectiveness!=null ||
    levels.some(lv=>pl[lv]?.damage_effectiveness!=null);

  const generatedDefs=[];
  if(isAttack || hasDamageMultiplier){
    generatedDefs.push({
      id:'attack_damage',
      text:lv=>attackDamageText(merged[lv]?.damage_multiplier)
    });
  }
  if(hasDamageEffectiveness){
    generatedDefs.push({
      id:'damage_effectiveness',
      text:lv=>damageEffectivenessText(merged[lv]?.damage_effectiveness)
    });
  }

  const fixedGenerated=[],variableGenerated=[];
  for(const def of generatedDefs){
    const vals=levels.map(def.text);
    if(vals.length && new Set(vals).size===1)fixedGenerated.push(vals[0]);
    else variableGenerated.push(def);
  }

  const fixedStatTexts=uniqueTexts(
    fixedKeys.map(k=>levels.length?resolvedTextByLevel[levels[0]]?.[k]:staticText[k])
  );

  return {
    levels,merged,resolvedTextByLevel,variableKeys,
    fixedGenerated:uniqueTexts(fixedGenerated),
    fixedStatTexts,
    variableGenerated
  };
}
function fixedEffectsHtml(model){
  const basic=model.fixedGenerated||[];

  }
  return `<div class="fixed-effects"><div class="fixed-effects-title">레벨과 무관한 효과</div>${groups}</div>`;

function levelStatHtml(model,lv){
  const basics=uniqueTexts((model.variableGenerated||[]).map(def=>def.text(lv)));
  const effects=uniqueTexts((model.variableKeys||[]).map(k=>model.resolvedTextByLevel[lv]?.[k]));

    out+=`<div class="stat-group stat-basic"><div class="stat-group-label">기본 수치</div>${basics.map(x=>`<div class="stat-line">${esc(x)}</div>`).join('')}</div>`;

  }
  return out;
}

function scalar(type,text){if(type==='null')return null;if(type==='boolean')return text==='true';if(type==='integer')return parseInt(text,10);if(type==='number')return Number(text);return text}
function nodeVal(el){const t=el.getAttribute('type');if(el.tagName==='property')return scalar(t,el.textContent||'');if(el.tagName==='item'){if(t==='object')return obj(el);if(t==='array')return [...el.children].map(nodeVal);return scalar(t,el.textContent||'')}if(el.tagName==='object')return obj(el);if(el.tagName==='array')return [...el.children].filter(x=>x.tagName==='item').map(nodeVal);return obj(el)}
function obj(el){const o={};if(!el)return o;for(const c of el.children){const n=c.getAttribute('name');if(n!==null)o[n]=nodeVal(c)}return o}

const FILTER_STORAGE_KEY='poe1-gem-viewer-filter-v3';
const tagAccentClass=k=>({
  fire:'tag-fire',cold:'tag-cold',lightning:'tag-lightning',physical:'tag-physical',
  chaos:'tag-chaos',attack:'tag-attack',spell:'tag-spell',minion:'tag-minion',critical:'tag-critical'
}[k]||'');


function cleanCompareNumber(v,decimals=1){
  const n=Number(v);
  if(!Number.isFinite(n))return '-';
  return Number(n.toFixed(decimals)).toLocaleString('ko-KR',{maximumFractionDigits:decimals});
}
function compareMetric(g,key){
  const c=g?.comparison||{};
  if(['physical','fire','cold','lightning','chaos'].includes(key)){
    const d=c[key]||{};
    if(d.avg==null||d.min==null||d.max==null)return {sort:null,text:'-'};
    const av=Number(d.avg),lo=Number(d.min),hi=Number(d.max);
    return Number.isFinite(av)&&Number.isFinite(lo)&&Number.isFinite(hi)
      ? {sort:av,text:`${cleanCompareNumber(lo,0)}~${cleanCompareNumber(hi,0)}`}
      : {sort:null,text:'-'};
  }
  if(c[key]==null)return {sort:null,text:'-'};
  const v=Number(c[key]);
  if(!Number.isFinite(v))return {sort:null,text:'-'};
  switch(key){
    case 'avgDamage': return {sort:v,text:cleanCompareNumber(v,v%1?1:0)};
    case 'crit':
    case 'weaponEfficiency':
    case 'damageEffectiveness':
    case 'attackSpeed':
      return {sort:v,text:`${cleanCompareNumber(v,1)}%`};
    case 'castSpeed': return {sort:v,text:`${cleanCompareNumber(v,2)}/초`};
    case 'cooldown': return {sort:v,text:`${cleanCompareNumber(v,2)}초`};
    default:return {sort:v,text:cleanCompareNumber(v,2)};
  }
}
function compareCellHtml(g,key){

  if(change)return balanceChangedCell(change,'compare-value');
  const m=compareMetric(g,key);

    : `<span class="compare-value">${esc(m.text)}</span>`;
}
function auxMetricValue(g,key){
  const a=g?.aux||{};
  if(key==='cost'||key==='reservation'){
    const x=a[key]||{};
    const s=x.sort==null?NaN:Number(x.sort);
    return {
      sort:Number.isFinite(s)?s:null,
      text:(x.text&&x.text!=='')?x.text:'-'
    };
  }
  if(key==='duration'||key==='radius'){
    const x=a[key]||{};
    const s=x.sort==null?NaN:Number(x.sort);
    return {
      sort:Number.isFinite(s)?s:null,
      text:(x.text&&x.text!=='')?x.text:'-'
    };
  }
  if(a[key]==null)return {sort:null,text:'-'};
  const v=Number(a[key]);
  if(!Number.isFinite(v))return {sort:null,text:'-'};
  switch(key){
    case 'costMultiplier': return {sort:v,text:`${cleanCompareNumber(v,1)}%`};
    case 'cooldown': return {sort:v,text:`${cleanCompareNumber(v,2)}초`};
    default:return {sort:v,text:cleanCompareNumber(v,2)};
  }
}
function auxCellHtml(g,key){
  const change=changeMode?balanceSelectedChange(g,key,'aux'):null;
  if(change)return balanceChangedCell(change,'aux-value');
  const m=auxMetricValue(g,key);
  return m.sort===null && m.text==='-'
    ? `<span class="aux-value compare-empty">-</span>`
    : `<span class="aux-value">${esc(m.text)}</span>`;
}
function currentSortMetric(g){
  if(compareSortColumn==='A')return changeMode?(balanceSelectedChange(g,compareA,'compare')||compareMetric(g,compareA)):compareMetric(g,compareA);
  if(compareSortColumn==='B')return changeMode?(balanceSelectedChange(g,compareB,'compare')||compareMetric(g,compareB)):compareMetric(g,compareB);
  if(compareSortColumn==='C')return changeMode?(balanceSelectedChange(g,auxMetric,'aux')||auxMetricValue(g,auxMetric)):auxMetricValue(g,auxMetric);
  return {sort:null,text:'-'};
}
function sortFilteredByComparison(){
  if(!['A','B','C'].includes(compareSortColumn))return;
  const dir=compareSortDir==='asc'?1:-1;
  filtered.sort((a,b)=>{
    const av=currentSortMetric(a).sort,bv=currentSortMetric(b).sort;
    if(av===null&&bv===null)return String(a.name||'').localeCompare(String(b.name||''),'ko');
    if(av===null)return 1;
    if(bv===null)return -1;
    if(av!==bv)return (av-bv)*dir;
    return String(a.name||'').localeCompare(String(b.name||''),'ko');
  });
}

    if(btn)btn.addEventListener('click',()=>toggleSort(col));
  }
}
function saveFilterState(){
  try{
    const states={};
    const weaponStateObj={};
    for(const [k,v] of tagStates)if(v)states[k]=v;
    for(const [k,v] of weaponStates)if(v)weaponStateObj[k]=v;
    sessionStorage.setItem(FILTER_STORAGE_KEY,JSON.stringify({
      q:$('#q')?.value||'',kind:$('#kind')?.value||'',variant:$('#variant')?.value||'',
      color:$('#color')?.value||'',tags:states,weapons:weaponStateObj,
      weaponFilterOpen,compareA,compareB,auxMetric,compareSortColumn,compareSortDir,page,listScrollY,balanceExisting,balanceNew
    }));
  }catch{}
}
function restoreFilterState(){
  try{
    const x=JSON.parse(sessionStorage.getItem(FILTER_STORAGE_KEY)||'null');
    if(!x)return;
    balanceExisting=x.balanceExisting!==false;
    balanceNew=x.balanceNew!==false;
    if($('#q'))$('#q').value=x.q||'';
    if($('#kind'))$('#kind').value=x.kind||'';
    if($('#variant'))$('#variant').value=(x.variant==='awakened'?'':(x.variant||''));
    if($('#color'))$('#color').value=x.color||'';
    tagStates.clear();
    weaponStates.clear();

    // Migrate the old skill-tag "bow" state to the new Bow weapon filter.
    for(const [k,v] of Object.entries(x.tags||{})){
      if(v!==1&&v!==-1)continue;
      if(k==='bow')weaponStates.set('Bow',v);
      else tagStates.set(k,v);
    }
    for(const [k,v] of Object.entries(x.weapons||{}))
      if(v===1||v===-1)weaponStates.set(k,v);

    weaponFilterOpen=Boolean(x.weaponFilterOpen)||weaponStates.size>0;
    if(COMPARE_OPTIONS.some(([k])=>k===x.compareA))compareA=x.compareA;
    if(COMPARE_OPTIONS.some(([k])=>k===x.compareB))compareB=x.compareB;
    if(AUX_OPTIONS.some(([k])=>k===x.auxMetric))auxMetric=x.auxMetric;
    if(['A','B','C'].includes(x.compareSortColumn))compareSortColumn=x.compareSortColumn;
    if(x.compareSortDir==='asc'||x.compareSortDir==='desc')compareSortDir=x.compareSortDir;
    if(Number.isFinite(Number(x.page)))page=Math.max(1,Number(x.page));
    if(Number.isFinite(Number(x.listScrollY)))listScrollY=Number(x.listScrollY);
  }catch{}
}
function renderTagFilters(){
  const box=$('#tagFilterList');if(!box||!M)return;
  const labels=M.tagLabels||{};
  const order=((Array.isArray(M.tagOrder)&&M.tagOrder.length)?M.tagOrder:Object.keys(labels))
    .filter(k=>k!=='bow');
  if(!order.length){
    box.innerHTML='<span class="err">manifest.json에 태그 정보가 없습니다.</span>';
    return;
  }
  box.innerHTML=`<button class="tag-filter-btn tag-reset" type="button" data-reset="1">Reset</button>`+
    order.map(k=>{
      const st=tagStates.get(k)||0;
      const cnt=all.reduce((n,g)=>n+(Array.isArray(g.tags)&&g.tags.includes(k)?1:0),0);
      return `<button type="button" class="tag-filter-btn ${tagAccentClass(k)} ${st===1?'is-on':st===-1?'is-off':''}" data-tag="${esc(k)}" data-state="${st}" title="${st===1?'포함':st===-1?'제외':'선택 안 함'} · ${cnt}개">${esc(labels[k]||k)} <small>${cnt}</small></button>`;
    }).join('');
  box.querySelector('[data-reset="1"]').onclick=()=>{
    tagStates.clear();renderTagFilters();apply(true);
  };
  box.querySelectorAll('[data-tag]').forEach(btn=>btn.onclick=()=>{
    const k=btn.dataset.tag;
    const now=tagStates.get(k)||0;
    const next=now===0?1:now===1?-1:0;
    if(next===0)tagStates.delete(k);else tagStates.set(k,next);
    renderTagFilters();apply(true);
  });
}

function balanceSelectedChange(g,key,area){

  const mods=(b.changes||[]).filter(c=>c.type==='modified'&&Number.isFinite(c.before)&&Number.isFinite(c.after));
  let hit=[];
  if(area==='compare'){
    if(key==='avgDamage')hit=mods.filter(c=>/^hit\.(physical|fire|cold|lightning|chaos)$/.test(c.key));
    else if(['physical','fire','cold','lightning','chaos'].includes(key))hit=mods.filter(c=>c.key===`hit.${key}`);
    else if(key==='castSpeed')hit=mods.filter(c=>c.key==='castTime');
    else if(key==='attackSpeed')hit=mods.filter(c=>c.key==='attackSpeed'||c.key==='attackTime');
    else if(key==='crit'||key==='damageEffectiveness')hit=mods.filter(c=>c.key===key);

  }else{
    const map={cost:['manaCost','lifeCost','energyShieldCost','rageCost'],reservation:['reservation','manaReservation','lifeReservation','reservationPercent'],costMultiplier:['costMultiplier'],cooldown:['cooldown'],duration:['duration','baseDuration','buffDuration','debuffDuration'],radius:['radius']};
    hit=mods.filter(c=>(map[key]||[]).includes(c.key));
  }
  if(!hit.length)return null;
  // Every displayed number must correspond to the selected comparison metric.
  if(key==='castSpeed'||key==='attackSpeed'){
    const c=hit[0];
    if(c.key==='castTime'||c.key==='attackTime'){
      if(c.before<=0||c.after<=0)return null;
      const old=1/c.before, newer=1/c.after;
      return {sort:newer,text:'',beforeText:`${cleanCompareNumber(old,2)}/초`,afterText:`${cleanCompareNumber(newer,2)}/초`,impact:c.impact};
    }
  }
  if(key==='avgDamage'){
    const gbase=compareMetric(g,'avgDamage').sort;
    const delta=hit.reduce((total,c)=>total+(c.after-c.before),0);
    // The 3.29 manifest is post-3.29; for 3.30 change it is pre-3.30.
    let before,after;
    if(Number.isFinite(gbase)){
      if(selectedPatch==='3.29') {after=gbase;before=gbase-delta;}
      else {before=gbase;after=gbase+delta;}
    }else{before=hit.reduce((a,c)=>a+c.before,0);after=hit.reduce((a,c)=>a+c.after,0);}
    const impact=hit.some(c=>c.impact==='buff')&&hit.some(c=>c.impact==='nerf')?'neutral':hit[0].impact;
    return {sort:after,beforeText:cleanCompareNumber(before,1),afterText:cleanCompareNumber(after,1),impact};
  }
  if(area==='aux'&&key==='cost'){
    const baseText=g.aux?.cost?.text;
    const delta=hit.reduce((n,c)=>n+c.after-c.before,0);
    let beforeText,afterText;
    if(baseText&&baseText!=='-'){
      // Preserve other simultaneously consumed resources that did not change.
      beforeText=baseText;
      afterText=baseText;
      for(const c of hit){
        const label=balanceResourceName(c.key);
        const oldPart=`${label} ${c.beforeText||cleanCompareNumber(c.before,2)}`;
        const newPart=`${label} ${c.afterText||cleanCompareNumber(c.after,2)}`;

      afterText=hit.map(c=>`${balanceResourceName(c.key)} ${c.afterText||cleanCompareNumber(c.after,2)}`).join(' · ');

  let afterText=c.afterText||cleanCompareNumber(c.after,2);

  const lv=c.level||g?.aux?.level||20;
  for(const [key,label] of [['avgDamage','평균 피해'],['crit','치명타율'],['damageEffectiveness','추가 피해 효율'],['castSpeed','시전 속도']]){
    push(label,compareMetric(g,key));
  }
  for(const [key,label] of [['cost','소모 비용'],['reservation','점유'],['costMultiplier','소모·점유 배율'],['cooldown','쿨다운'],['duration','지속시간'],['radius','효과 반경']]){
    push(label,auxMetricValue(g,key));
  }
  if(!entries.length)return '';
  return `<div class="balance-extra-title">신규 젬 기본 정보 · Lv${esc(lv)}</div><div class="balance-modal-grid">${entries.slice(0,10).map(([k,v])=>`<article class="balance-tile"><div class="balance-tile-label">${esc(k)}</div><div class="balance-new">${esc(v)}</div></article>`).join('')}</div>`;
}
function balanceDetailInfoTile(label,value){
  const long=String(value).length>85?'wide':'';
  return `<article class="balance-tile balance-info-tile ${long}"><div class="balance-tile-label">${esc(label)}</div><div class="balance-description">${esc(value)}</div></article>`;
}
async function appendNewGemXmlDetails(g){
  // New gems often have much more detailed level/quality descriptions in the
  // existing XML snapshot than in the launch-note summary. Fetch only on demand.
  if(!g?.chunk||!g?.balanceData)return;
  const id=g.balanceData.id;
  try{
    const doc=await getChunk(g.chunk);
    const gem=[...doc.querySelectorAll('gem')].find(x=>x.getAttribute('effectId')===g.effectId);
    if(!gem)return;
    const d=obj(gem.querySelector(':scope > repoeGemData'));
    const pl=d.per_level||{};
    const available=levelKeys(pl).filter(x=>Number.isFinite(Number(x))&&Number(x)<=20);
    const lv=String(g.comparison?.level||g.aux?.level||(available.length?available.at(-1):1));
    const merged=mergeRepoe(d.static||{},pl[lv]||{});
    const keys=sortedStatKeys(Object.keys(merged.stat_text||{}),tooltipRankMap(d.tooltip_order||[]));
    const rows=[];
    for(const k of keys){
      const text=merged.stat_text[k];
      if(typeof text==='string'&&text.trim()&&!rows.some(x=>x[1]===text.trim()))rows.push(['젬 효과',text.trim()]);
    }
    const q=quality20Lines(d.static||{});
    for(const line of q)rows.push(['퀄리티 20%',line]);
    if(merged.required_level!=null)rows.push(['요구 레벨',String(merged.required_level)]);
    const req=merged.stat_requirements||{};
    for(const [k,label] of [['str','힘'],['dex','민첩'],['int','지능']])
      if(req[k]!=null && Number(req[k])>0) rows.push([`${label} 요구치`,String(req[k])]);
    const tooltip=(d.support_gem?.support_text||d.active_skill?.description||'').trim();
    if(tooltip)rows.push(['설명',tooltip]);
    const body=$('#balanceModalBody');
    if(!rows.length||!$('#balanceModal').classList.contains('is-open')||$('#balanceModal').dataset.gem!==id)return;
    body.insertAdjacentHTML('beforeend',`<div class="balance-extra-title">게임 데이터 · Lv${esc(lv)} 효과 / 퀄리티</div><div class="balance-modal-grid">${rows.slice(0,18).map(([k,v])=>balanceDetailInfoTile(k,v)).join('')}</div>`);
  }catch(e){console.warn('신규 젬 상세 데이터 조회 실패:',e.message);}
}
function openBalanceModal(g){
  const b=g?.balanceData;
  if(!b)return;
  const root=$('#balanceModal');
  root.dataset.gem=b.id;
  balanceFocused=document.activeElement;
  const isNew=b.gemState==='new';
  const numeric=(b.changes||[]).filter(c=>c.type==='modified'&&Number.isFinite(c.before)&&Number.isFinite(c.after));
  const other=(b.changes||[]).filter(c=>!numeric.includes(c));
  numeric.sort((a,b)=>balanceGroupsOrder.indexOf(a.group)-balanceGroupsOrder.indexOf(b.group));
  const typeText=(b.kind==='support'?'보조젬':'스킬젬')+(b.variant==='transfigured'?' · 변형':b.variant==='vaal'?' · 바알':'');
  $('#balanceModalTitle')?.removeAttribute('id');
  $('#balanceModalContext').textContent=`${balancePack?.previousPatch||'?'} → ${balancePack?.patch||selectedPatch} · ${typeText}`;
  const title=`<h2 class="balance-modal-name" id="balanceModalTitle">${esc(g.name)}</h2>`;
  const body=`${title}<div class="balance-modal-en">${esc(b.nameEn||'')}</div><div class="balance-modal-verdict">${isNew?'신규 젬':`변경 항목 ${b.changes.length}개`}</div>`+
    `<div class="balance-modal-grid">${numeric.map(balanceNumericTile).join('')}${other.map(balanceQualitativeTile).join('')}</div>`+
    (isNew?balanceNewGemMetrics(g):'');
  $('#balanceModalBody').innerHTML=body;
  $('#balanceModalBasis').textContent='Lv20 · 퀄리티 20%'+(balancePack?.source?.status==='partial'?' · 선별 자료':'');
  const source=balancePack?.source?.url||'https://www.pathofexile.com/forum/view-thread/3987254';
  $('#balanceModalSource').href=/^https:\/\//i.test(source)?source:'https://www.pathofexile.com';
  root.classList.add('is-open');
  root.setAttribute('aria-hidden','false');
  document.body.classList.add('balance-modal-open');
  $('#balanceModalBody').scrollTop=0;
  $('.balance-modal-sheet').focus({preventScroll:true});
  if(isNew)appendNewGemXmlDetails(g);
  if(!location.hash.startsWith('#balance-gem=')){
    try{history.pushState({poeBalanceModal:true},'','#balance-gem='+encodeURIComponent(b.id));balanceHistoryOpened=true;}catch{}
  }
}
function restoreBalanceModalScroll(){
  if(!balanceModalScroll)return;
  const {windowY,listY}=balanceModalScroll;
  const restore=()=>{
    const list=$('#listPanel .tw');
    if(list)list.scrollTop=listY;
    window.scrollTo({top:windowY,behavior:'auto'});
  };
  restore();
  requestAnimationFrame(()=>requestAnimationFrame(restore));
}
function closeBalanceModal(fromPopstate=false){
  if(!$('#balanceModal').classList.contains('is-open'))return;
  $('#balanceModal').classList.remove('is-open');
  $('#balanceModal').setAttribute('aria-hidden','true');
  document.body.classList.remove('balance-modal-open');
  if(balanceFocused?.isConnected)balanceFocused.focus({preventScroll:true});
  restoreBalanceModalScroll();
  if(!fromPopstate && balanceHistoryOpened && history.state?.poeBalanceModal){
    balanceHistoryOpened=false;
    history.back();
  }else balanceHistoryOpened=false;
}
$('#versionMode').value=activeView;
$('#versionMode').addEventListener('change',e=>{
  if(!VIEW_MODES.includes(e.target.value))return;
  const url=new URL(window.location.href);
  url.searchParams.set('view',e.target.value);
  url.hash='';
  window.location.assign(url.href);
});
document.body.classList.toggle('balance-change',changeMode);
$('#balanceFilters').hidden=!changeMode;
if(changeMode){
  for(const btn of document.querySelectorAll('[data-balance-filter]'))btn.addEventListener('click',()=>{
    if(btn.dataset.balanceFilter==='new')balanceNew=!balanceNew;
    else balanceExisting=!balanceExisting;
    renderBalanceFilters();apply(true);
  });
}
$('#balanceModalClose').addEventListener('click',()=>closeBalanceModal());
$('#balanceModal').addEventListener('click',e=>{if(e.target.dataset.closeBalance==='true')closeBalanceModal();});
window.addEventListener('keydown',e=>{
  if($('#balanceModal').classList.contains('is-open')&&e.key==='Escape')closeBalanceModal();
  if($('#balanceModal').classList.contains('is-open')&&e.key==='Tab'){
    const focusables=Array.from($('#balanceModal').querySelectorAll('button:not([disabled]),a[href]'));
    if(!focusables.length)return;
    if(e.shiftKey&&document.activeElement===focusables[0]){e.preventDefault();focusables.at(-1).focus();}
    if(!e.shiftKey&&document.activeElement===focusables.at(-1)){e.preventDefault();focusables[0].focus();}
  }
});
window.addEventListener('popstate',()=>{
  if(!changeMode)return;
  if($('#balanceModal').classList.contains('is-open')&&!location.hash.startsWith('#balance-gem=')){
    closeBalanceModal(true);
  }else if(!$('#balanceModal').classList.contains('is-open')){
    // history.back() may restore scroll after modal close; reinstate the saved position.
    restoreBalanceModalScroll();
  }
});

loadManifest();
</script></body></html>
